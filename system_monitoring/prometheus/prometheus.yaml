global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s # The default is every 1 minute.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090' ]
  - job_name: 'node-exporter'
    static_configs:
    - targets: ['10.5.61.230:9100']
  - job_name: 'sensors'
    static_configs:
    - targets:
      - 'wangdak-pi:8080'
